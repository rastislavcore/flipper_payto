name: Build FAP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build external app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          app-dir: .
          ufbt-args: "faps"
      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipper-payto-fap
          path: dist/**/*.fap
